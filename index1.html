<!DOCTYPE html>
<html>
<head>
    <title>Pattern Search App</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
        }

        .container{
            width:70%;
            margin:auto;
            margin-top:50px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        textarea,input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            margin-top:15px;
            padding:10px;
            width:100%;
            background:#007bff;
            color:white;
            border:none;
            cursor:pointer;
        }

        .result{
            margin-top:20px;
            background:#eef;
            padding:15px;
            border-radius:5px;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>Pattern Search Application</h1>

    <form method="POST">

        <label>Enter Text</label>
        <textarea name="text" rows="8" required></textarea>

        <label>Enter Pattern</label>
        <input type="text" name="pattern" required>

        <button type="submit">Search</button>

    </form>

    {% if result %}
    <div class="result">

        <h2>{{ result }}</h2>

        <p><strong>Total Occurrences:</strong> {{ count }}</p>

        {% if count > 0 %}
        <p><strong>Positions:</strong> {{ positions }}</p>
        {% endif %}

    </div>
    {% endif %}

</div>

</body>
</html>
